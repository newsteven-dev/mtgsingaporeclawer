<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · MTG SG Price Compare</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#b3261e" />
  <link rel="stylesheet" href="styles.css" />
  <script src="/vendor/supabase.js"></script>
</head>
<body class="auth-page">
  <main class="login-card">
    <h1>MTG SG Price Compare</h1>
    <p class="muted">Sign in to see every search the app has captured so far.</p>
    <button type="button" id="github" class="github-btn">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Sign in with GitHub
    </button>
    <p id="msg" class="login-msg" role="alert" hidden></p>
    <p class="small"><a href="/">← Back to price search</a></p>
  </main>
  <script type="module">
    import { signInWithGitHub, getSession, getClient } from './auth-client.js';
    const msg = document.getElementById('msg');
    const show = (text) => { msg.textContent = text; msg.hidden = false; };

    const params = new URLSearchParams(location.search + location.hash.replace(/^#/, '&'));
    if (params.get('error_description')) show(params.get('error_description'));

    getClient().then(async (client) => {
      if (!client) return show('Sign-in is not set up on this server yet. Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY.');
      if (await getSession()) location.replace('/searches.html');
    });

    document.getElementById('github').addEventListener('click', async (e) => {
      e.currentTarget.disabled = true;
      try { await signInWithGitHub(); }
      catch (err) { show(err.message); e.currentTarget.disabled = false; }
    });
  </script>
</body>
</html>
