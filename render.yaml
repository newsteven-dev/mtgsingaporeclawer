# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New -> Blueprint -> pick this repository.
services:
  - type: web
    name: mtg-sg-price-compare
    runtime: node
    region: singapore
    # Always on, 512 MB. Keep this in step with the plan chosen in Render: Render syncs
    # this file, so "free" here would move the service back to the free plan.
    plan: starter
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/stores
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        value: https://dlkknzbftscwktzzpwcn.supabase.co
      # Public key used by the login page (safe to share).
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_8woD8kF7r_4q7Az_OfiV_g_dj6bdkeE
      # GitHub usernames allowed to see captured searches (comma-separated).
      # Only used when ADMIN_EMAILS is empty.
      - key: ADMIN_GITHUB_USERS
        value: newsteven-dev
      # Verified GitHub emails allowed to see captured searches (comma-separated).
      # Set the value in the Render dashboard so it isn't stored in the repo.
      - key: ADMIN_EMAILS
        sync: false
      # The site's public address, used in search-engine metadata, the sitemap and link previews.
      - key: SITE_URL
        value: https://mtg-sg-price-compare.onrender.com
      # Google Search Console's "HTML tag" verification code (just the content="..." value).
      # Set it in the Render dashboard; leave it empty if you verify another way.
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      # Secret: Render asks for this value when you create the service. Never commit it.
      - key: SUPABASE_SECRET_KEY
        sync: false
